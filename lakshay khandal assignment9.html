<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">
    <style>
        .main{
            height: 550px;
            width: 100%;
            /* border: 1px solid black; */
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(225deg,rgb(175, 43, 120) ,rgb(56, 226, 238) );
        }
        .box{
            height: 80%;
            width: 40%;
            /* border: 1px solid black; */
            border-radius: 10px;
            background-color: white;
        }
        .icon{
            height: 20%;
            width: 100%;
            /* border: 1px solid black; */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button{
            width: 40%;
            height: 50%;
            margin: auto;
            border: none;
            border-radius: 10px;
        }
        #b1{
            background-color: blue;
            color: white;
        }
        #b2{
            background-color: white;
            border: 1px solid grey;
        }
        form{
            display: flex;
            flex-direction: column;
            height: 60%;
            width: 70%;
            margin: auto;
            gap: 10px;
        }
        input{
            height: 40px;
            border: none;
            background-color: lightgray;
            border-radius: 10px;
        }
        p{
            text-align: center;
            color: gray;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">
            <h1 align="center">Sign In With</h1>
            <div class="icon">
                <button id="b1"><i class="fab fa-facebook"></i>Facebook</button>
                <button id="b2"><i class="fab fa-google"></i>Google</button>
            </div>
            <form action="">
                <label for="">Username</label>
                <input type="text">
                <label for="">Password  <u><i>Forget?</i></u></label>
                <input type="password">
                <input type="submit" value="Sign In" style="background-color: black; color: white;">
                <p>Not a Member? <u>Sign up now</u></p>
            </form>
        </div>
    </div>
</body>
</html>
